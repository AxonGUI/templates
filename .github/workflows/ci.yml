name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 每周一对着「最新已发布」的 axon-gui / axon-shell 再跑一次：
  # 模板钉的是版本范围，框架发了新版而模板跑不起来时要有人知道。
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  build:
    name: 构建 ${{ matrix.template }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        template: [vue, react, angular]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.template }}/web/package.json
      - name: 安装前端依赖
        working-directory: ${{ matrix.template }}/web
        run: npm install --no-audit --no-fund
      - name: 构建前端
        working-directory: ${{ matrix.template }}/web
        run: npm run build

  contract:
    name: 契约测试（真窗口）
    runs-on: ubuntu-22.04
    needs: build
    strategy:
      fail-fast: false
      matrix:
        template: [vue, react, angular]
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu --disable-dev-shm-usage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 装 Qt 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbfile1 libxkbcommon0 libdbus-1-3 libfontconfig1 libnss3 \
            libglib2.0-0 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libxshmfence1
      - name: 装 axon-gui / axon-shell
        run: |
          python -m pip install -U pip
          python -m pip install --upgrade "axon-gui>=5.7.2" "axon-shell>=0.3.0"
      - name: 装前端依赖并构建
        working-directory: ${{ matrix.template }}/web
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: 类型生成物没漂移
        working-directory: ${{ matrix.template }}/web
        run: npm run types:check
      - name: 点一次按钮
        run: python tools/verify_template.py --template ${{ matrix.template }}
