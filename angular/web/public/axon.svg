<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Axon">
  <title>Axon</title>
  <!--
    Axon 的标记:A 字 = Axon 的首字母, 两条腿 = Python 侧与 Web 侧,
    中间那条浅蓝横梁 = 两边之间的那条通道(QWebChannel)。16px 下仍可辨认。
    配色来自项目主色 #3451b2 + 通道色 #63C6E2→#2E86C4。
  -->
  <defs>
    <linearGradient id="axon-bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63C6E2"/>
      <stop offset="1" stop-color="#2E86C4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#3451b2"/>
  <path d="M28.5 13.5 L35.5 13.5 L54.5 50 L46.5 50 L32 30.5 L17.5 50 L9.5 50 Z" fill="#ffffff"/>
  <path d="M26.5 37 L37.5 37 L42.7 44.5 L21.3 44.5 Z" fill="url(#axon-bridge)"/>
</svg>
