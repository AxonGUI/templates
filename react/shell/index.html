<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/axon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axon Template</title>
    <script src="/axon-shell/shell.js"></script>
  </head>
  <body data-shell="1">
    <header id="axon-titlebar" class="axon-titlebar" data-axon-drag>
      <span class="axon-titlebar__brand">Axon</span>
      <span class="axon-titlebar__title">React 模板</span>
      <span class="axon-titlebar__buttons" data-axon-no-drag>
        <button type="button" data-axon-window="min" title="最小化">—</button>
        <button type="button" data-axon-window="max" title="最大化">□</button>
        <button type="button" data-axon-window="close" class="is-close" title="关闭">×</button>
      </span>
    </header>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
